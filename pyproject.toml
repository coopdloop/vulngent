[project]
name = "vulngent"
version = "0.1.0"
description = "Agentic vulnerability remediation ledger: tracking, prioritization, and stakeholder outreach for security teams"
requires-python = ">=3.12"
dependencies = [
    "autogen-agentchat>=0.7.5",
    "autogen-ext[openai]>=0.7.5",
    "fpdf2>=2.8.8",
    "jira>=3.10.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pygithub>=2.10.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "slack-sdk>=3.44.1",
    "sqlalchemy>=2.0.52",
    "typer>=0.27.2",
]

[project.scripts]
vulngent = "vulngent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vulngent"]
